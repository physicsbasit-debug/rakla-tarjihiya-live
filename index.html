/* Phase 3-A: شريط السياق التعليمي الثابت */

/* Phase 3-D batch 2: slim run status strip instead of the big banner; readiness notice */

/* tablet: keep the question and the groups side by side; comfortable touch targets */

/* ===== 3-F batch 1: the stage (board) screen. Scoped to #stageScreen, which exists only in the projection window.
   One scale unit (--u) follows the smaller of width / height, so type stays readable from the back of a classroom
   at 1280x720, 1920x1080 and on a tablet, without touching the scoring engine, effects or sync. ===== */
#stageScreen{--u:min(1vw,1.72vh)}
#stageScreen .stage-wrap{display:flex;flex-direction:column;min-height:100vh;padding:calc(var(--u)*1.4) calc(var(--u)*3) calc(var(--u)*1.2)}
#stageScreen .stage-top{align-items:flex-end}
#stageScreen .stage-title{font-size:max(24px,calc(var(--u)*2.6))}
#stageScreen .stage-sub{font-size:max(14px,calc(var(--u)*1.35));margin-top:4px}
#stageScreen .stage-kicker{font-size:max(14px,calc(var(--u)*1.4))}
#stageScreen .stage-content{flex:1;min-height:0;grid-template-columns:minmax(0,1fr) clamp(250px,calc(var(--u)*24),440px);gap:calc(var(--u)*1.6);margin-top:calc(var(--u)*1.2);align-items:stretch}
#stageScreen .stage-question{display:flex;flex-direction:column;min-height:0;padding:calc(var(--u)*2) calc(var(--u)*2.4);border-radius:calc(var(--u)*1.8)}
#stageScreen .stage-question-top .stage-kicker{color:#8a6d1f}
#stageScreen .stage-question h2{font-size:clamp(24px,calc(var(--u)*3.2),68px);line-height:1.55;margin:calc(var(--u)*.5) 0 calc(var(--u)*1)}
#stageScreen .stage-question img.stage-figure{max-height:calc(var(--u)*17)!important;margin:0 auto calc(var(--u)*1.2)}
#stageScreen .stage-time{font-size:clamp(32px,calc(var(--u)*4),84px);line-height:1.1;padding:.12em .5em;min-width:0;border-radius:calc(var(--u)*1.1)}
#stageScreen .stage-time.time-low{background:#fff1d6;color:#9a5600}
#stageScreen .stage-time.time-up{background:#fde4df;color:#b3372a}
#stageScreen .stage-time-caption{font-size:max(13px,calc(var(--u)*1.2))}
#stageScreen .stage-pick-hint{font-size:max(14px,calc(var(--u)*1.35));padding:calc(var(--u)*.7) calc(var(--u)*1.2);margin-bottom:calc(var(--u)*1.1)}

<script>// قراءة الأرقام العربية/الفارسية/الإنجليزية والتحقق من الحقول العددية
// يُضمّ هذا الملف قبل src/app.js عند البناء (tools/build.mjs) داخل النص البرمجي نفسه؛ لا وحدات ES.
// أرقام عربية-هندية (٠-٩) وفارسية (۰-۹) وإنجليزية مقبولة في الإدخال؛ تُرجع عددًا صحيحًا أو NaN دون أي تخمين.
function parseLocalizedInt(raw){
 if(typeof raw==='number')return Number.isInteger(raw)?raw:NaN;
 let t=String(raw??'').trim();
 t=t.replace(/[\u0660-\u0669]/g,d=>String(d.charCodeAt(0)-0x0660)).replace(/[\u06F0-\u06F9]/g,d=>String(d.charCodeAt(0)-0x06F0));
 t=t.replace(/[\u066C\u060C,،\s\u200E\u200F\u202A-\u202E]/g,'');
 return /^\d+$/.test(t)?Number(t):NaN;
}
// يقرأ حقلًا عدديًا من النموذج ويفشل برسالة واضحة بدل القص الصامت.
function readIntField(fd,name,label,min,max){
 const raw=String(fd.get(name)??'').trim();
 if(!raw)return {error:`حقل «${label}» مطلوب (من ${min} إلى ${max}).`};
 const v=parseLocalizedInt(raw);
 if(!Number.isFinite(v))return {error:`«${label}» يجب أن يكون عددًا صحيحًا من ${min} إلى ${max} (يُقبل الإدخال بالأرقام العربية أو الإنجليزية).`};
 if(v<min||v>max)return {error:`«${label}» خارج الحدود: القيمة ${v} والمسموح من ${min} إلى ${max}.`};
 return {value:v};
}

// سجل تعديلات القراءة: ما عُدّل أو لم يُستورد يُبلَّغ به المعلم
// يُضمّ هذا الملف قبل src/app.js عند البناء (tools/build.mjs) داخل النص البرمجي نفسه؛ لا وحدات ES.
// سجل التعديلات أثناء قراءة ملفات قديمة/خارجية حتى لا يُقصّ شيء دون إبلاغ المعلم.
let sanitizeLog={adjusted:new Set(),dropped:new Set()};
function resetSanitizeLog(){sanitizeLog={adjusted:new Set(),dropped:new Set()}}
function clampLogged(raw,fallback,lo,hi,id){
 const n=Number(raw)||fallback,v=clamp(n,lo,hi);
 if(raw!==undefined&&raw!==null&&Number(raw)!==v)sanitizeLog.adjusted.add(id);
 return v;
}
function logDropped(q){sanitizeLog.dropped.add(String((q&&(q.id||q.text))||'؟').slice(0,60))}
function cleanQuestionList(list,cap){
 list.slice(cap).forEach(logDropped);
 return list.slice(0,cap).map((q,i)=>{const c=cleanQuestion(q,i);if(!c)logDropped(q);return c}).filter(Boolean);
}

// النسخ الاحتياطية الآمنة ونسخ الاسترداد
// يُضمّ هذا الملف قبل src/app.js عند البناء (tools/build.mjs) داخل النص البرمجي نفسه؛ لا وحدات ES.
const PREBACKUP_KEEP=3;
// نسخة احتياطية آمنة قبل أي عملية قد تغيّر البيانات؛ تُخزَّن في المتصفح (آخر 3) وإلا تُنزَّل كملف. تُرجع true عند التأمين.
function safetyBackup(reason){
 const stamp=new Date().toISOString().replace(/[:.]/g,'-'),json=JSON.stringify(persistedState());
 try{
  localStorage.setItem(KEY+'__prebackup_'+stamp+'__'+reason,json);
  const keys=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(KEY+'__prebackup_'))keys.push(k)}
  keys.sort().slice(0,Math.max(0,keys.length-PREBACKUP_KEEP)).forEach(k=>localStorage.removeItem(k));
  return true;
 }catch(e){
  try{download('rakla_tarjihiya_prebackup_'+stamp+'.json',json,'application/json;charset=utf-8');return true}catch(e2){return false}
 }
}
function listRecoveryCopies(){const out=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(KEY+'__')&&/__(recovery|prebackup)_/.test(k))out.push(k)}}catch(e){}return out.sort()}
function downloadRecoveryCopies(){const keys=listRecoveryCopies();if(!keys.length)return toast('لا توجد نسخ استرداد محفوظة.',true);keys.forEach(k=>download('rakla_tarjihiya_'+k.slice(KEY.length+2)+'.json',localStorage.getItem(k)||'','application/json;charset=utf-8'));toast(`نُزّلت ${keys.length} نسخة. لا تُحذف النسخ من المتصفح.`)}

// تصدير بنك الأسئلة فقط ودمجه
// يُضمّ هذا الملف قبل src/app.js عند البناء (tools/build.mjs) داخل النص البرمجي نفسه؛ لا وحدات ES.
// تصدير الأسئلة فقط: لا طلبة ولا نتائج ولا إعدادات مسابقة.
function exportQuestionsOnly(){
 storeActiveWorkspace();
 const slots={};let n=0;
 for(const mode of ASSESSMENTS)for(const [key,w] of Object.entries(state.curriculum.slots[mode]||{})){
  const qs=w.questions||[],ties=w.tieQuestions||[];if(!qs.length&&!ties.length)continue;
  (slots[mode]??={})[key]={questions:structuredClone(qs),tieQuestions:structuredClone(ties)};n+=qs.length+ties.length;
 }
 if(!n)return toast('لا توجد أسئلة لتصديرها.',true);
 download('rakla_tarjihiya_questions_only.json',JSON.stringify({app:'rakla-tarjihiya',exportKind:'questions-only',version:1,exportedAt:new Date().toISOString(),slots},null,2),'application/json;charset=utf-8');
 toast(`صُدّر بنك الأسئلة (${num(n)} سؤالًا) دون أي بيانات للطلبة أو النتائج.`);
}
function sanitizeNote(){
 const parts=[];
 if(sanitizeLog.adjusted.size)parts.push(`عُدّلت قيم الزمن/النقاط في ${sanitizeLog.adjusted.size} سؤالًا لأنها خارج الحدود (الزمن 5–300 ثانية، النقاط 1–1000).`);
 if(sanitizeLog.dropped.size)parts.push(`لن يُستورد ${sanitizeLog.dropped.size} سؤالًا لأنه غير صالح أو زائد عن الحد (150 سؤالًا لكل بنك و50 للركلة الفاصلة).`);
 return parts.join('\n');
}
// معيار واحد للتطابق يُستعمل في كشف التكرار وفي كشف تعارض المعرّفات:
// كل ما يؤثر في المحتوى التعليمي والتقويمي (النص، الخيارات، الإجابة، صور السؤال والخيارات، الشرح، الصعوبة، الزمن، النقاط).
// المعرّف والتصنيف (originId/topic) لا يدخلان فيه.
function imageSig(d){d=String(d||'');if(!d)return '';let h=5381;for(let i=0;i<d.length;i++)h=((h<<5)+h+d.charCodeAt(i))|0;return d.length+':'+(h>>>0)}
function questionCoreKey(q){return [q.text,JSON.stringify(q.options),q.correct].join('\u0001')}
function questionFingerprint(q){return [questionCoreKey(q),imageSig(q.image),JSON.stringify((q.optionImages||['','','','']).map(imageSig)),q.explanation||'',q.difficulty||'',q.time,q.points].join('\u0001')}
function sameQuestionContent(a,b){return !!a&&!!b&&questionFingerprint(a)===questionFingerprint(b)}

function mergeQuestionBank(raw){
 if(!raw.slots||typeof raw.slots!=='object')throw Error('بنك أسئلة غير صالح');
 resetSanitizeLog();storeActiveWorkspace();
 const adds=[],conflicts=[];let duplicates=0,similar=0,overCap=0,badScopes=0;
 for(const mode of ASSESSMENTS){
  const modeSlots=raw.slots[mode];if(!modeSlots||typeof modeSlots!=='object')continue;
  for(const key of Object.keys(modeSlots)){
   if(!validCurrKey(key)){badScopes++;continue}
   const dest=state.curriculum.slots[mode][key]||blankWorkspace(),src=modeSlots[key]||{};
   const existing=new Map([...dest.questions,...dest.tieQuestions].map(q=>[q.id,q])),ids=new Set(existing.keys());
   const prints=new Set([...dest.questions,...dest.tieQuestions].map(questionFingerprint)),cores=new Set([...dest.questions,...dest.tieQuestions].map(questionCoreKey));
   for(const [field,cap] of [['questions',150],['tieQuestions',50]]){
    let room=cap-dest[field].length;
    for(const q of Array.isArray(src[field])?src[field]:[]){
     const c=cleanQuestion(q,0);if(!c){logDropped(q);continue}
     if(prints.has(questionFingerprint(c))){duplicates++;continue}   // المحتوى نفسه تمامًا موجود في الدرس (بأي معرّف، ومنه نسخة تعارض أُضيفت سابقًا): تُتجاوز فلا تتكرر عند إعادة الاستيراد
     if(ids.has(c.id)){
      // المعرّف نفسه بمحتوى مختلف: لا يُتجاهل ولا يُستبدل؛ يُضاف الوارد بمعرّف جديد وتبقى الموجودة كما هي.
      if(room<=0){overCap++;continue}
      conflicts.push({scope:key,text:c.text.slice(0,60),old:String(existing.get(c.id)?.text||'').slice(0,60)});
      room--;c.originId=c.id;c.id='q'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);ids.add(c.id);adds.push({mode,key,field,q:c});continue;
     }
     if(room<=0){overCap++;continue}
     if(cores.has(questionCoreKey(c)))similar++;   // النص والخيارات نفسها لكن الصور أو الخصائص تختلف: سؤال مستقل يُضاف مع التنبيه
     room--;ids.add(c.id);prints.add(questionFingerprint(c));cores.add(questionCoreKey(c));adds.push({mode,key,field,q:c});
    }
   }
  }
 }

 if(duplicates)lines.push(`${duplicates} سؤالًا مطابقًا لسؤال موجود في الدرس (النص والخيارات والإجابة والصور والشرح والصعوبة والزمن والنقاط) سيُتجاوز.`);
 if(similar)lines.push(`${similar} سؤالًا بنص وخيارات سؤال موجود نفسها لكن بصور أو خصائص مختلفة؛ سيُضاف كسؤال مستقل لا كمكرر.`);
 if(conflicts.length){lines.push(`⚠ ${conflicts.length} تعارضًا: المعرّف نفسه بمحتوى مختلف. لن يُستبدل الموجود؛ ستُضاف الأسئلة الواردة كنسخ جديدة بمعرّف جديد لتراجعها:`);conflicts.slice(0,5).forEach(c=>lines.push(`• الموجود: «${c.old}» ← الوارد: «${c.text}»`));if(conflicts.length>5)lines.push(`… و${conflicts.length-5} أخرى.`)}
 if(overCap)lines.push(`${overCap} سؤالًا لن يُضاف لامتلاء البنك (150 سؤالًا لكل درس و50 للركلة الفاصلة).`);
 if(badScopes)lines.push(`${badScopes} درسًا غير معروف سيُتجاوز.`);
 const note=sanitizeNote();if(note)lines.push(note);
 if(!adds.length){toast(lines.join(' '),true);return}
 if(!confirm(lines.join('\n')+'\n\nمتابعة؟'))return;
 if(!safetyBackup('before-questions-merge'))return toast('تعذّر تأمين نسخة من البيانات الحالية، فأُلغي الدمج.',true);
 stopTimer();
 for(const a of adds){
  const slot=state.curriculum.slots[a.mode][a.key]||(state.curriculum.slots[a.mode][a.key]=blankWorkspace());
  slot[a.field].push(a.q);
 }
 if(state.curriculum.slots[state.settings.mode][currentCurrScope()])restoreWorkspace(state,state.curriculum.slots[state.settings.mode][currentCurrScope()]);
 if(save()){render();toast(`أُضيف ${adds.length} سؤالًا إلى بنوك الدروس.`)}
}

function archivedCurriculumNumbers(g,u=null){
 const numbers=new Set();
 const c=state.curriculum;
 const keys=[c.lastLesson,...Object.values(c.selected||{}),...Object.values(c.slots||{}).flatMap(slots=>Object.keys(slots||{}))];
 for(const k of keys){const match=/^(9|10)\|(\d{1,2})\|(\d{1,2})$/.exec(String(k));if(!match||match[1]!==g)continue;
  if(u===null)numbers.add(Number(match[2]));else if(Number(match[2])===u)numbers.add(Number(match[3]));}
 for(const k of Object.keys(c.labels||{})){const match=/^[ul]\|(9|10)\|(\d{1,2})(?:\|(\d{1,2}))?$/.exec(k);
  if(!match||match[1]!==g)continue;
  if(u===null)numbers.add(Number(match[2]));else if(Number(match[2])===u&&match[3])numbers.add(Number(match[3]));}

}

function normalizeCurriculum(raw,oldWorkspaces){
 const out=newCurriculum();
 if(!raw||raw.version!==1){
  for(const mode of ASSESSMENTS){out.slots[mode][CURR_UNSORTED]=structuredClone(oldWorkspaces[mode]||blankWorkspace());out.selected[mode]=CURR_UNSORTED}
  return out;
 }
 if(raw.labels&&typeof raw.labels==='object'&&!Array.isArray(raw.labels)){
  for(const [key,value] of Object.entries(raw.labels))if(/^[ul]\|(9|10)\|\d{1,2}(\|\d{1,2})?$/.test(key))out.labels[key]=String(value).slice(0,95);
 }
 out.lastLesson=validCurrKey(raw.lastLesson)&&raw.lastLesson!==CURR_UNSORTED?raw.lastLesson:CURR_FIRST;
 for(const mode of ASSESSMENTS){
  const chosen=validCurrKey(raw.selected?.[mode])?raw.selected[mode]:CURR_UNSORTED;
  out.selected[mode]=chosen;
  const slots=raw.slots?.[mode];
  if(slots&&typeof slots==='object'&&!Array.isArray(slots)){
   for(const [key,v] of Object.entries(slots).slice(0,220))if(validCurrKey(key))out.slots[mode][key]=cleanWorkspace(v,{});

  if(!out.slots[mode][chosen])out.slots[mode][chosen]=structuredClone(oldWorkspaces[mode]||blankWorkspace());
 }

}

function timerWidget(q){const p=Math.round((state.timeLeft/q.time)*100);const low=state.timeLeft<=5;const status=isDone(q.id)?'تم التصحيح':qIsLocked(q)?'أُغلق السؤال':running?'الوقت جارٍ':state.timeLeft===0?'انتهى الوقت':'جاهز للانطلاق';return `<div class="timer-wrap"><div><div class="timer-ring" id="timerRing" style="--p:${p};--timer-color:${low?'#bd6553':'#70a477'}"><div id="timerNumber" class="timer-number">${String(Math.floor(state.timeLeft/60)).padStart(2,'0')}:${String(state.timeLeft%60).padStart(2,'0')}</div></div><div class="timer-text" id="timerLabel">${status}</div></div><div class="timer-info"><strong>${isTurns()?'زمن دور المجموعة':'زمن السؤال المشترك'}</strong><div>${num(q.time)} ثانية ${isTurns()?'للمجموعة الحالية':'لجميع المجموعات'}</div></div></div>`}
function mainQuestion(q){
 const done=isDone(q.id),locked=qIsLocked(q),chosen=ansFor(q.id)[activeTeam];
 const needsStart=!isMainStarted(q);
 const guard=done||locked||!state.started[q.id]||state.finished;
 const groupLine=isTurns()?`<div class="answer-play-guide turns-hint"><div class="answer-play-heading"><b>الدور الآن: ${esc(assignedName())}</b><span>الدور ${num(state.currentIndex+1)} / ${num(state.questions.length)}</span></div><div class="answer-play-hint">${done?'اعتمدت الإجابة، انتقل إلى الدور التالي.':locked?'انتهى الدور، انتقل إلى السؤال التالي.':needsStart?'ابدأ وقت المجموعة قبل الإجابة.':'سؤال مستقل لهذه المجموعة، وستبدأ المجموعة التالية بوقت كامل.'}</div></div>`:
 `<div class="answer-play-guide"><div class="answer-play-heading"><b>لوحة المعلم السرية • اختر المجموعة وسجّل إجابة الفريق</b><span>${num(answeredCount(q.id))} / ${num(state.settings.count)} سجّلوا</span></div><div class="team-pills">${Array.from({length:state.settings.count},(_,i)=>`<button class="team-pill ${activeTeam===i?'active':''} ${Number.isInteger(ansFor(q.id)[i])?'answered':''}" data-action="selectTeam" data-team="${i}" ${done?'disabled':''}>${esc(state.settings.groups[i])} ${Number.isInteger(ansFor(q.id)[i])?'✓':''}</button>`).join('')}</div><div class="answer-play-hint">${locked?'أُغلقت الإجابات؛ لا يمكن تعديلها بعد انتهاء الوقت.':needsStart?'ابدأ المؤقت أولًا لتفعيل تسجيل الإجابات.':`المجموعة المختارة: ${esc(state.settings.groups[activeTeam])}${chosen>=0?` • الإجابة المسجلة ${LETTERS[chosen]}`:chosen===-1?' • دون إجابة':' • لم تجب بعد'}. لا تعرض نافذة المعلم على السبورة.`}</div></div>`;
 const actionControls=done?`<button class="button soft" data-action="next">${state.currentIndex===state.questions.length-1?'عرض النتائج':isTurns()?'الدور التالي':'السؤال التالي'} ${ICONS.arrow}</button><button class="button white sm" data-action="reopen">${ICONS.reset} إعادة التصحيح</button>`:
 `<button class="button primary" data-action="timer" ${locked||isTurns()&&!turnReadiness().ready?'disabled':''}>${running?ICONS.pause:ICONS.play} ${running?'إيقاف الوقت':needsStart?'بدء الوقت':'استئناف الوقت'}</button><button class="button white" data-action="resetTime">${ICONS.reset} إعادة الوقت</button>${!locked&&isMainStarted(q)&&!isTurns()?`<button class="button white" data-action="lockQuestion">${ICONS.check} إنهاء السؤال الآن</button>`:''}${isTurns()?`<button class="button primary" data-action="next" ${!canAdvance()?'disabled':''}>${state.currentIndex===state.questions.length-1?'إعلان النتائج':'الدور التالي'} ${ICONS.arrow}</button><button class="button white sm" data-action="skipTurn" ${turnRecorded()||locked?'disabled':''}>${ICONS.arrow} تجاوز الدور</button>`:isSummative()?`<button class="button primary" data-action="next" ${!canAdvance()?'disabled':''}>${state.currentIndex===state.questions.length-1?'إنهاء البطاقات وإعلان النتائج':'السؤال التالي'}</button>`:`<button class="button primary" data-action="reveal" ${!locked?'disabled':''}>${ICONS.check} كشف الإجابة واحتساب النقاط</button>`}`;
 return `<article class="card"><div class="card-head"><div class="q-meta"><span class="q-serial">السؤال ${num(state.currentIndex+1)} من ${num(state.questions.length)}</span><span class="q-topic">${esc(q.topic)}</span><span class="level-tag ${q.difficulty||'متوسط'}">${esc(q.difficulty||'متوسط')}</span></div><span class="pill ${locked?'':'amber'}">${done?'تم اعتماد النتيجة':locked?'تم إغلاق الإجابات':answeredCount(q.id)+' من '+state.settings.count+' سجّلوا الإجابة'}</span></div><div class="question-layout"><div class="question-top">${timerWidget(q)}<span class="q-points">${num(q.points)} نقطة للإجابة الصحيحة</span></div><div class="question-text">${esc(q.text)}</div>${q.image?`<img class="question-figure" src="${esc(q.image)}" alt="رسم توضيحي للسؤال">`:''}${groupLine}<div class="options-grid">${q.options.map((o,i)=>`<button type="button" class="answer-card ${!guard?'clickable':''} ${!done&&!isTurns()&&chosen===i?'chosen':''} ${done?(i===q.correct?'correct':'wrong'):''}" ${guard?'disabled':''} data-action="pickOption" data-choice="${i}" aria-label="الإجابة ${LETTERS[i]}: ${esc(o||'صورة')}" aria-pressed="${!done&&chosen===i}"><span class="answer-letter">${LETTERS[i]}</span><span class="answer-content">${q.optionImages?.[i]?`<img class="answer-image" src="${esc(q.optionImages[i])}" alt="صورة الاختيار ${LETTERS[i]}">`:''}${o?`<span class="answer-text">${esc(o)}</span>`:''}</span>${done&&i===q.correct?'<span class="answer-badge">الإجابة الصحيحة</span>':''}</button>`).join('')}</div>${done&&q.explanation?`<div class="answer-explanation"><b>تفسير الإجابة:</b> ${esc(q.explanation)}</div>`:''}<div class="step-progress"><i style="width:${Math.round(completed()/Math.max(1,state.questions.length)*100)}%"></i></div></div><div class="question-actions"><div class="action-group">${actionControls}</div><div class="action-group"><button class="button white sm" data-action="previous" ${state.currentIndex<=0?'disabled':''}>${ICONS.chevron} السابق</button><button class="button white sm" data-action="openStage">${ICONS.expand} شاشة العرض</button></div></div></article>`;
}
function teamsPanel(q){if(isTurns()){
 const r=ranks(),idx=assignedTeam(),a=ansFor(q.id)[idx];
 return `<aside class="card"><div class="card-head"><div><div class="card-title">${ICONS.cup} ركلات الترجيح</div><div class="caption" style="margin-top:6px">سؤال مختلف لكل مجموعة،  ${q.time} ثانية للدور</div></div></div><div class="card-pad"><div class="turn-team-highlight"><span>المجموعة صاحبة الدور</span><strong>${esc(assignedName())}</strong><small>الدور ${num(state.currentIndex+1)} من ${num(state.questions.length)}</small></div><div class="side-note">${state.started[q.id]?'اختر إحدى الإجابات الأربعة. ينتقل الدور للسؤال الجديد بعد الضغط على «الدور التالي».':'ابدأ الوقت لفتح الإجابات. يُعاد ضبط الزمن عند انتقال الدور إلى المجموعة التالية.'}</div><div class="turn-side-status">${isDone(q.id)?`تم التصحيح • ${a===q.correct?'إجابة صحيحة':'إجابة غير صحيحة أو متروكة'}`:Number.isInteger(a)?`تم تسجيل ${a===-1?'دون إجابة':LETTERS[a]}`:'لم تُسجل إجابة بعد'}</div><div class="turn-rank-title">${isSummative()?'المجموعات المشاركة':'الترتيب الحالي'}</div><div class="teams-list">${r.map(t=>`<div class="turn-ranking-row"><span>${esc(t.name)}</span><strong>${isSummative()?'●':num(t.score)+' نقطة'}</strong></div>`).join('')}</div>${!turnReadiness().ready?`<div class="warning">${esc(turnReadiness().message)}</div>`:''}</div></aside>`;
 }const done=isDone(q.id);const positions=scores();return `<aside class="card"><div class="card-head"><div><div class="card-title">${ICONS.cup} إجابات المجموعات</div><div class="caption" style="margin-top:6px">${isSummative()?'سجّل بطاقات الخروج دون كشف التصحيح':'سجّل اختيار كل مجموعة قبل كشف الإجابة'}</div></div><span class="pill">${state.settings.count} مجموعات</span></div><div class="card-pad"><div class="side-note">${done?'انتهى التصحيح، وثُبّتت نقاط المجموعات لهذا السؤال.':isSummative()?'ابدأ الوقت وسجّل إجابات بطاقات الخروج من نافذة المعلم؛ تُقفل تلقائيًا بانتهائه ولا تظهر الإجابات الصحيحة حتى نهاية المسابقة.':'ابدأ الوقت، ثم سجّل الإجابات من لوحة المعلم الخاصة قبل انتهاء الزمن. على السبورة يظهر فقط عدد المجموعات التي أجابت. تُقفل الإجابات تلقائيًا عند انتهاء الوقت.'}</div><div class="teams-list">${Array.from({length:state.settings.count},(_,i)=>{const a=ansFor(q.id)[i];const right=done&&a===q.correct;const wrong=done&&Number.isInteger(a)&&a>=0&&a!==q.correct;const rowScore=positions.find(t=>t.i===i)?.score||0;return `<div class="team-row ${!done&&i===activeTeam?'current-team':''} ${done?(right?'correct-team':wrong?'wrong-team':''):(Number.isInteger(a)&&a>=0?'has-answer':'')}"><div class="team-header"><button type="button" class="team-identity team-select" data-action="selectTeam" data-team="${i}" ${done?'disabled':''} aria-label="اختيار مجموعة ${esc(state.settings.groups[i])}"><div class="team-avatar" style="background:${COLORS[i]}">${num(i+1)}</div><span class="team-name">${esc(state.settings.groups[i])}</span></button><span class="team-score">${isSummative()&&!state.finished?'•••':num(rowScore)} <small>نقطة</small></span></div>${done?`<div class="team-outcome"><span>${a===undefined||a===-1?'لم تُسجل إجابة':`الإجابة ${LETTERS[a]}`}</span><span style="color:${right?'#368653':wrong?'#b65f51':'#869188'}">${right?'صحيحة +'+num(q.points):wrong?'غير صحيحة +0':'دون نقاط'}</span></div>`:`<div class="mini-choices">${[0,1,2,3,-1].map(j=>`<button class="choice-mini ${a===j?'selected':''} ${j===-1?'none':''}" data-action="answer" data-team="${i}" data-choice="${j}" ${qIsLocked(q)||!isMainStarted(q)?'disabled':''} aria-label="${j===-1?'بدون إجابة':'الخيار '+LETTERS[j]} للمجموعة ${esc(state.settings.groups[i])}">${j===-1?'لا إجابة':LETTERS[j]}</button>`).join('')}</div>`}</div>`}).join('')}</div></div><div class="side-footer">آلية النقاط: الإجابة الصحيحة تمنح نقاط السؤال، والخاطئة أو المتروكة تمنح 0. لا تُخصم نقاط.</div></aside>`}
function livePage(){if(!state.questions.length)return `${runStatusStrip()}<section class="competition-empty" aria-label="الاستعداد للمسابقة"><div class="competition-empty-icon">${ICONS.layers}</div><h2>لا توجد أسئلة جاهزة لهذه المسابقة</h2><p>جهّز أسئلة الدرس من قسم «إعداد الأسئلة»، ثم عُد إلى المسابقة لبدء النشاط.</p><button type="button" class="button primary" data-action="tab" data-tab="bank">${ICONS.book} الانتقال إلى إعداد الأسئلة</button></section>`;const q=qCurrent();return `${runStatusStrip()}${isTurns()&&!turnReadiness().ready?`<div class="warning turn-warning" role="alert">لا يمكن بدء التناوب قبل موازنة الأسئلة: ${esc(turnReadiness().message)} <button class="button white sm" data-action="tab" data-tab="bank">بنك الأسئلة</button></div>`:''}<div class="content-grid">${mainQuestion(q)}${teamsPanel(q)}</div>${studentTeamPanel()}`}
function optionPreviewHTML(src,i){return src?`<div class="option-preview"><img src="${esc(src)}" alt="الصورة المرفقة للاختيار ${LETTERS[i]}"><button type="button" class="button danger sm" data-action="removeOptionImage" data-choice="${i}">إزالة الصورة</button></div>`:`<span class="option-empty">لا توجد صورة لهذا الاختيار</span>`}
function questionForm(){
 const q=[...state.questions,...state.tieQuestions].find(q=>q.id===editId)||null,opts=q?.options||['','','',''];
 const isTie=!!(q&&state.tieQuestions.some(x=>x.id===q.id)),correct=q?.correct??0;

function startTieRound(){
 if(!state.finished){toast('تنتهي المسابقة الأساسية قبل ركلات الحسم.',true);return}
 if(state.tieBreak.active){toast('توجد ركلة فاصلة جارية بالفعل.',true);return}
 const candidates=tieCandidates();if(candidates.length<2){toast('لا يوجد تعادل في المركز الأول حاليًا.');return}
 const q=availableTieQuestions()[0];if(!q){toast('أضف سؤالًا احتياطيًا لركلة فاصلة في بنك الأسئلة أولًا.',true);state.activeTab='bank';save();render();return}
 stopTimer();state.tieBreak.active={questionId:q.id,candidates,answers:{},started:false,locked:false,timeLeft:q.time};state.tieBreak.accepted=false;
 activeTeam=candidates[0];state.activeTab='results';save();render();closeWinners();toast('ركلة فاصلة: نفس السؤال والوقت للفرق المتعادلة، وسرية تامة للإجابات.');
}
function cancelTieRound(){
 if(!state.tieBreak.active)return;
 if(!confirm('هل تريد إلغاء الركلة الفاصلة الجارية؟ لن تُحتسب نقاطها.'))return;
 stopTimer();state.tieBreak.active=null;save();render();toast('أُلغيت الجولة الفاصلة دون احتساب نقاط.');
}
function toggleTieTimer(){
 const a=state.tieBreak.active;if(!a||a.locked)return;
 if(a.timeLeft<=0){toast('انتهى وقت الركلة الفاصلة.',true);return}
 running=!running;if(running){const first=!a.started;a.started=true;if(first)refereeWhistle('start');runTimer()}else stopTimer();save();render();
}
function chooseTieAnswer(choice){
 const a=state.tieBreak.active;if(!a||a.locked||!a.started||a.timeLeft<=0){toast('ابدأ مؤقت الركلة الفاصلة أولًا.',true);return}
 if(!a.candidates.includes(activeTeam)||!Number.isInteger(choice)||choice<0||choice>3)return;
 a.answers[activeTeam]=choice;
 const remaining=a.candidates.find(i=>!Number.isInteger(a.answers[i]));
 if(remaining!==undefined)activeTeam=remaining;
 else {stopTimer();a.locked=true;toast('اكتملت جميع إجابات ركلة الحسم؛ يمكنك الآن اعتماد التصحيح.')}
 save();render();
}
function lockTieRound(){const a=state.tieBreak.active;if(!a||a.locked||!a.started)return;stopTimer();a.locked=true;save();render();toast('أُغلقت الركلة الفاصلة ويمكن تصحيحها.');}
function finishTieRound(){
 const a=state.tieBreak.active,q=tieQuestion();if(!a||!q||!a.locked){toast('أغلق المؤقت وسجّل ما توفر من إجابات أولًا.',true);return}

function pedagogicalData(){
 const questions=state.questions.map((q,idx)=>{
  const done=isDone(q.id),eligible=candidatesFor(q),n=eligible.length,answers=ansFor(q.id);
  const right=done?eligible.filter(i=>answers[i]===q.correct).length:0;
  const answered=done?eligible.filter(i=>Number.isInteger(answers[i])&&answers[i]>=0).length:0;
  return {q,idx,done,n,right,answered,rate:done&&n?Math.round(right*100/n):null};
 });
 const analyzed=questions.filter(x=>x.done),totalEligible=analyzed.reduce((s,x)=>s+x.n,0);
 const totalCorrect=analyzed.reduce((s,x)=>s+x.right,0),totalAnswered=analyzed.reduce((s,x)=>s+x.answered,0);
 const group=Array.from({length:state.settings.count},(_,i)=>{
  const opportunities=analyzed.filter(x=>x.n===state.settings.count||isTurns()&&x.idx%state.settings.count===i);
  const right=opportunities.filter(x=>ansFor(x.q.id)[i]===x.q.correct).length;
  return {name:state.settings.groups[i],opportunities:opportunities.length,right,rate:opportunities.length?Math.round(right*100/opportunities.length):null};
 });
 return {questions,analyzed,totalEligible,totalCorrect,totalAnswered,rate:totalEligible?Math.round(totalCorrect*100/totalEligible):null,group,review:analyzed.filter(x=>x.rate<50).sort((a,b)=>a.rate-b.rate)};
}

function lessonReviewHTML(){

 const hiddenGroup=isSummative()&&!state.finished,hiddenInd=mode==='ختامي'&&!area.assessmentFinished.ختامي;
 const scored=state.questions.filter(q=>isDone(q.id)).length;

 if(!scored&&!att.length&&!part.length)return '';
 const cls=reviewClass(mode);
 const doneIds=new Set(att.filter(a=>a.classId===cls?.id).map(a=>a.studentId));
 const missing=cls&&!cls.deleted?cls.students.filter(s=>!doneIds.has(s.id)):[];

 const lows=[];
 if(!hiddenGroup&&!isTurns())for(const x of pedagogicalData().review.slice(0,4))lows.push(`السؤال ${num(x.idx+1)} (جماعي): ${num(x.rate)}% صحيحة`);

 return `<section class="card lesson-review" aria-label="مراجعة الحصة"><div class="card-head"><h3 class="card-title">${ICONS.book} مراجعة الحصة</h3><span class="pill">${esc(mode)}</span></div><div class="review-grid">

 <div><h4>من شارك؟</h4><ul><li>${cls?`${num(doneIds.size)} طالبًا شاركوا فرديًا في ${esc(cls.name)}`:'لا توجد شعبة محددة'}</li>${cls?.deleted?'<li>الشعبة محذوفة من القائمة؛ لا يتوفر كشفها الأصلي لتحديد غير المشاركين</li>':''}${cls&&missing.length?`<li>لم يسجلوا مشاركة فردية: ${num(missing.length)}${missing.length<=8?' — '+missing.map(s=>esc(s.name)).join('، '):''}</li>`:''}<li>${num(partStudents)} طلاب شاركوا داخل المجموعات</li></ul></div>

function teamParticipationHTML(){

 if(!part.length)return '';

  if(!running)return;

function makeId(prefix='id'){return prefix+Date.now().toString(36)+Math.random().toString(36).slice(2,9)}
function defaultStudentArea(){return {classes:[],classId:'',mode:'individual',questionId:'',selected:null,usedCycles:{},session:null,attempts:[],teamParticipations:[],softMatch:false,assessmentFinished:{'تكويني':false,'ختامي':false},schoolRosterVersion:''}}
function sanitizeStudentArea(raw){
 const result=defaultStudentArea();if(!raw||typeof raw!=='object')return result;
 const classIds=new Set(),studentIds=new Set();
 result.classes=(Array.isArray(raw.classes)?raw.classes:[]).slice(0,60).map((c,i)=>{
  const id=String(c.id||makeId('class')).slice(0,70);if(classIds.has(id))return null;classIds.add(id);
  const students=(Array.isArray(c.students)?c.students:[]).slice(0,300).map((s,j)=>{
   if(!s||!String(s.name||'').trim())return null;
   let sid=String(s.id||makeId('student')).slice(0,70);if(studentIds.has(sid))sid=makeId('student');studentIds.add(sid);
   return {id:sid,name:String(s.name).trim().slice(0,90),level:STUDENT_LEVELS.includes(s.level)?s.level:null,group:Number.isInteger(s.group)&&s.group>=0&&s.group<10?s.group:null};
  }).filter(Boolean);
  return {id,name:String(c.name||`شعبة ${i+1}`).trim().slice(0,80),students};
 }).filter(Boolean);
 result.classId=result.classes.some(c=>c.id===raw.classId)?raw.classId:(result.classes[0]?.id||'');
 result.mode=raw.mode==='teams'?'teams':'individual';result.questionId=String(raw.questionId||'').slice(0,70);
 result.softMatch=raw.softMatch===true;
 result.usedCycles=raw.usedCycles&&typeof raw.usedCycles==='object'&&!Array.isArray(raw.usedCycles)?raw.usedCycles:{};
 result.selected=raw.selected&&typeof raw.selected==='object'?raw.selected:null;
 result.session=raw.session&&typeof raw.session==='object'?raw.session:null;
 result.attempts=Array.isArray(raw.attempts)?raw.attempts.filter(a=>a&&a.studentId&&a.questionId).slice(-4000):[];
 result.teamParticipations=Array.isArray(raw.teamParticipations)?raw.teamParticipations.filter(a=>a&&a.studentId).slice(-4000):[];
 result.assessmentFinished={تكويني:!!raw.assessmentFinished?.تكويني,ختامي:!!raw.assessmentFinished?.ختامي};
 result.schoolRosterVersion=typeof raw.schoolRosterVersion==='string'?raw.schoolRosterVersion.slice(0,100):'';
 return result;
}

function schoolRosterKey(value){
 return rosterNameKey(value).replace(/[-\\]/g,'/').replace(/\s*\/\s*/g,'/');
}
function addSchoolRosterIfNeeded(force=false,area=state.studentArea){
 // النسخة العامة لا تتضمن كشوف مدرسية مدمجة؛ تُستورد الكشوف محليًا من Excel.
 if(!SCHOOL_ROSTER_BASELINE.length)return {added:0,existing:0,conflicts:0,skipped:true,empty:true};
 if(!force&&area.schoolRosterVersion===SCHOOL_ROSTER_VERSION)return {added:0,existing:0,conflicts:0,skipped:true};
 // سلامة الكشف المدمج (18 شعبة / 595 طالبًا) تُفحص وقت البناء في tools/build.mjs لا وقت التشغيل.
 let added=0,existing=0,conflicts=0;
 const classKeys=new Set();
 for(const block of SCHOOL_ROSTER_BASELINE){
  const key=schoolRosterKey(block.name);
  if(classKeys.has(key))throw Error('تكرار شعبة في بيانات المدرسة.');
  classKeys.add(key);
  let dest=area.classes.find(c=>schoolRosterKey(c.name)===key);
  if(!dest){
   if(area.classes.length>=60)throw Error('وصلت قوائم الشعب للحد المسموح؛ صدّر نسخة احتياطية وراجع الشعب الزائدة.');
   dest={id:makeId('class'),name:block.name,students:[]};area.classes.push(dest);
  }
  const byName=new Map(dest.students.map(st=>[rosterNameKey(st.name),st]));
  for(const pair of block.students){
   const name=pair[0],level=pair[1],sid=rosterNameKey(name),found=byName.get(sid);
   if(found){
    existing++;
    if(found.level&&level&&found.level!==level)conflicts++;
    // لا نغيّر تصنيفًا عدّله المعلم أو سجل محاولة موجودًا.
    continue;
   }
   if(dest.students.length>=300)throw Error('تجاوز عدد طلبة شعبة الحد الأقصى.');
   const next={id:makeId('student'),name,level,group:null};
   dest.students.push(next);byName.set(sid,next);added++;
  }
 }
 if(!area.classId&&area.classes.length)area.classId=area.classes[0].id;
 area.schoolRosterVersion=SCHOOL_ROSTER_VERSION;
 return {added,existing,conflicts,skipped:false};
}
// تحديث الكشوف المدمجة بأمان: تجربة على نسخة معزولة أولًا؛ لا نسخة احتياطية إلا إذا وُجد طلبة جدد فعلًا وكانت هناك بيانات طلبة قائمة.
// تُرجع {info,cancelled}. عند تعذّر تأمين النسخة يُلغى تحديث الكشوف فقط.
function applySchoolRosterSafely(force){
 const plan=addSchoolRosterIfNeeded(force,structuredClone(state.studentArea));
 if(plan.skipped)return {info:plan,cancelled:false};
 const hasStudents=state.studentArea.classes.some(c=>c.students.length>0);
 if(plan.added>0&&hasStudents&&!safetyBackup('before-roster-update'))return {info:plan,cancelled:true};
 return {info:addSchoolRosterIfNeeded(force),cancelled:false};
}
function rosterBaselineCount(){return SCHOOL_ROSTER_BASELINE.reduce((n,c)=>n+c.students.length,0)}
// النص يعكس ما هو مدمج فعلًا في هذه النسخة، لا أرقامًا ثابتة.
function rosterBannerHTML(){
 if(SCHOOL_ROSTER_BASELINE.length)return `<strong>كشوف مدمجة في هذه النسخة: ${num(rosterBaselineCount())} طالبًا في ${num(SCHOOL_ROSTER_BASELINE.length)} شعبة</strong><p>أُدرجت الأسماء والتصنيفات في هذه النسخة المحلية فلا تحتاج إلى رفعها مرة أخرى. استيراد Excel متاح عند تحديث البيانات. لا تنشر هذا الملف علنًا لأنه يتضمن أسماء وتصنيفات الطلبة.</p>`;
 const total=state.studentArea.classes.reduce((n,c)=>n+c.students.length,0);
 return `<strong>${total?`لديك ${num(total)} طالبًا في ${num(state.studentArea.classes.length)} شعبة (محفوظون في هذا المتصفح فقط)`:'لا توجد كشوف طلبة بعد'}</strong><p>هذه النسخة لا تحتوي كشوفًا مدمجة. استورد كشوف الطلبة من ملف Excel (XLSX) من جهازك؛ تبقى البيانات في هذا المتصفح ولا تُرسل إلى أي مكان.</p>`;
}
function restoreSchoolRoster(){
 try{
  const applied=applySchoolRosterSafely(true),info=applied.info;
  if(applied.cancelled)return toast('تعذّر تأمين نسخة احتياطية قبل إضافة الطلبة، فأُلغي تحديث الكشوف. بقية البيانات لم تتأثر.',true);

// استيراد كشف نتائج الصف دفعة واحدة: يدعم جميع أوراق XLSX (9/1، 10/1...)
// التغييرات لا تُحفظ إلا بعد معاينة المعلم واعتمادها.
let bulkRosterDraft=null;
function normalizeDigits(value){return String(value??'').replace(/[٠-٩]/g,ch=>String(ch.charCodeAt(0)-1632)).replace(/[۰-۹]/g,ch=>String(ch.charCodeAt(0)-1776))}
function rosterNameKey(value){return normalizeDigits(value).normalize('NFKC').replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/\s+/g,' ').trim()}
function rosterClassName(sheetName,rows){
 // لا نحاول قراءة أوراق التدقيق والملاحظات باعتبارها شعبًا حتى إن ورد اسم شعبة ضمن سجلاتها.
 if(/التدقيق|الملاحظات|ملخص|احصاء|إحصاء|تعليمات/.test(rosterNameKey(sheetName)))return null;
 const candidates=[sheetName,...rows.slice(0,4).flatMap(row=>row.slice(0,3).filter(Boolean).map(String))];
 for(const raw of candidates){
  const v=normalizeDigits(raw).replace(/[\\]/g,'/');
  let m=v.match(/(?:^|[^\d])(9|10)\s*[-/_ـ]\s*(\d{1,2})(?:[^\d]|$)/);
  if(m&&Number(m[2])>0&&Number(m[2])<=30)return Number(m[1])+'/'+Number(m[2]);
  m=v.match(/(?:الصف\s*)?(التاسع|العاشر)\s*[\s\/|:،-]*\s*(?:الشعبة|شعبة|الفصل)\s*\/?\s*(\d{1,2})/);
  if(m&&Number(m[2])>0&&Number(m[2])<=30)return (m[1]==='التاسع'?'9':'10')+'/'+Number(m[2]);
 }
 return null;
}
function workbookSheetRows(files){
 const xml=s=>{const doc=new DOMParser().parseFromString(s,'application/xml');if(doc.querySelector('parsererror'))throw Error('ملف Excel يحتوي XML غير صالح.');return doc};
 const shared=files.has('xl/sharedStrings.xml')?Array.from(xml(files.get('xl/sharedStrings.xml')).getElementsByTagNameNS('*','si'),si=>Array.from(si.getElementsByTagNameNS('*','t')).map(t=>t.textContent).join('')):[];
 const workbook=files.has('xl/workbook.xml')?xml(files.get('xl/workbook.xml')):null;
 const rels=files.has('xl/_rels/workbook.xml.rels')?xml(files.get('xl/_rels/workbook.xml.rels')):null;
 const linkMap=new Map(rels?Array.from(rels.getElementsByTagNameNS('*','Relationship')).map(rel=>[rel.getAttribute('Id'),rel.getAttribute('Target')]):[]);
 let sheets=workbook?Array.from(workbook.getElementsByTagNameNS('*','sheet')).map(s=>{
  const target=linkMap.get(s.getAttribute('r:id')||s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id'))||'';
  const path=target.startsWith('/')?target.slice(1):target.startsWith('xl/')?target:'xl/'+target.replace(/^\.\//,'');
  return {name:s.getAttribute('name')||'',path};
 }).filter(x=>files.has(x.path)):[];
 if(!sheets.length)sheets=[...files.keys()].filter(x=>/^xl\/worksheets\/sheet\d+\.xml$/.test(x)).sort((a,b)=>Number(a.match(/sheet(\d+)/)[1])-Number(b.match(/sheet(\d+)/)[1])).map((path,i)=>({name:'ورقة '+(i+1),path}));
 if(sheets.length>60)throw Error('عدد أوراق الملف يتجاوز الحد المسموح.');
 return sheets.map(({name,path})=>{
  const rows=[];
  const data=xml(files.get(path));
  const rowNodes=Array.from(data.getElementsByTagNameNS('*','row')).slice(0,600);
  for(const row of rowNodes){const cells=[];
   for(const c of Array.from(row.getElementsByTagNameNS('*','c'))){
    const colname=(c.getAttribute('r')||'A1').match(/^[A-Z]+/i)?.[0]||'A';let col=0;
    for(const ch of colname.toUpperCase())col=col*26+(ch.charCodeAt(0)-64);col--;
    if(col>=25)continue;
    const type=c.getAttribute('t'),raw=c.getElementsByTagNameNS('*','v')[0]?.textContent||'';
    const value=type==='s'?shared[Number(raw)]||'':type==='inlineStr'?Array.from(c.getElementsByTagNameNS('*','t')).map(t=>t.textContent).join(''):raw;
    cells[col]=value;
   }
   if(cells.some(x=>String(x??'').trim()))rows.push(cells);
  }
  return {name,rows};
 });
}
function classifyRosterCategory(raw){
 const v=rosterNameKey(raw);
 if(!v||v.includes('غير مصنف')||v.includes('غير محدد')||v==='-')return {level:null,issue:false};
 const level=normalizedLevel(v);
 if(level)return {level,issue:false};
 if(v==='جيد')return {level:'متوسط',issue:false};
 if(v==='دون المستوى'||v==='دون مستوي')return {level:'يحتاج دعم',issue:false};
 return {level:null,issue:true};
}
function rosterDeclaredCount(sheet){
 const preamble=sheet.rows.slice(0,6).flat().filter(x=>x!==undefined&&x!==null).map(normalizeDigits).join(' | ');
 const match=preamble.match(/عدد\s*الطلبة\s*[:：]\s*(\d{1,3})/);
 return match?Number(match[1]):null;
}
function rosterDataFromSheet(sheet){
 const name=rosterClassName(sheet.name,sheet.rows);if(!name)return {ignored:true,sheet:sheet.name,reason:'تعذر تحديد الصف والشعبة'};
 const expected=rosterDeclaredCount(sheet);
 const headerAt=sheet.rows.findIndex(r=>r.some(x=>/^(اسم\s*الطالب|اسم\s*الطالبة|الاسم|student\s*name)$/i.test(String(x||'').trim())));
 if(headerAt<0)return {ignored:true,sheet:sheet.name,reason:'لا يوجد عمود اسم الطالب'};
 const headers=sheet.rows[headerAt].map(x=>rosterNameKey(x||''));
 const nameCol=headers.findIndex(x=>/^(اسم الطالب|اسم الطالبة|الاسم|student name)$/i.test(x));
 const levelCol=headers.findIndex(x=>/^(الفئة التحصيلية|التصنيف|المستوى|المستوى التحصيلي|الفئة|التحصيل)$/i.test(x));
 if(nameCol<0||levelCol<0)return {ignored:true,sheet:sheet.name,reason:'لا توجد أعمدة الأسماء والتصنيفات المطلوبة'};
 const valid=[],issues=[];const seen=new Set();
 for(const row of sheet.rows.slice(headerAt+1)){
  const studentName=String(row[nameCol]||'').trim();
  if(!studentName||/^(المجموع|المتوسط|الاجمالي|إجمالي|تعداد)/.test(studentName))continue;
  const key=rosterNameKey(studentName);if(seen.has(key)){issues.push('اسم مكرر داخل '+name);continue}seen.add(key);
  const cls=classifyRosterCategory(row[levelCol]);
  if(cls.issue){issues.push('فئة غير معروفة في '+name+'؛ راجع الكشف الأصلي');continue}
  valid.push({name:studentName.slice(0,90),level:cls.level,group:null});
 }
 if(expected!==null&&valid.length!==expected){
  return {invalid:true,name,sheet:sheet.name,expected,actual:valid.length,reason:`كشف ${name}: المتوقع ${expected} طالبًا، لكن تمت قراءة ${valid.length} فقط`};
 }
 return {name,sourceSheet:sheet.name,students:valid,issues,expected};
}
function makeBulkRosterDraft(sheets,filename){
 const groups=new Map(),skipped=[],issues=[],errors=[];
 for(const sheet of sheets){
  const parsed=rosterDataFromSheet(sheet);
  if(parsed.invalid){errors.push(parsed.reason);continue}
  if(parsed.ignored){
   // أوراق التدقيق الإضافية لا تُعامل شعبًا؛ لكن فشل قراءة أي شعبة مشكلة تمنع الحفظ.
   if(rosterClassName(sheet.name,sheet.rows))errors.push(`${sheet.name}: ${parsed.reason}`);
   else skipped.push(parsed.sheet+' ('+parsed.reason+')');
   continue;
  }
  if(!groups.has(parsed.name))groups.set(parsed.name,{name:parsed.name,students:[],issues:[],expected:0});
  const group=groups.get(parsed.name);
  group.students.push(...parsed.students);
  if(parsed.expected!==null)group.expected+=parsed.expected;
  issues.push(...parsed.issues);
 }
 for(const g of groups.values())if(g.expected&&g.students.length!==g.expected)errors.push(`الشعبة ${g.name}: المتوقع ${g.expected} طالبًا، والمقروء ${g.students.length}`);
 const classes=[...groups.values()].sort((a,b)=>{
  const [ag,as]=a.name.split('/').map(Number),[bg,bs]=b.name.split('/').map(Number);return ag-bg||as-bs;
 });
 let added=0,duplicates=0,pending=0,unknown=0,conflicts=0;
 for(const item of classes){
  const keys=new Set(),actual=state.studentArea.classes.find(c=>rosterNameKey(c.name.replace(/[-]/g,'/'))===rosterNameKey(item.name));
  const existing=new Map((actual?.students||[]).map(s=>[rosterNameKey(s.name),s]));
  item.newCount=0;item.duplicateCount=0;item.unclassifiedCount=0;item.updateCount=0;item.conflictCount=0;
  item.students=item.students.filter(s=>{
   const key=rosterNameKey(s.name);
   if(keys.has(key)){issues.push('تكرار الاسم نفسه في ورقتين من شعبة '+item.name);return false}
   keys.add(key);return true;
  });
  for(const s of item.students){
   if(!s.level){item.unclassifiedCount++;unknown++}
   const old=existing.get(rosterNameKey(s.name));
   if(old){item.duplicateCount++;duplicates++;
    if(!old.level&&s.level){item.updateCount++;pending++}
    else if(old.level&&s.level&&old.level!==s.level){item.conflictCount++;conflicts++}
   }else{item.newCount++;added++}
  }
 }
 return {filename,classes,skipped,issues,errors,added,duplicates,pending,unknown,conflicts,created:Date.now()};
}

 <div class="student-inline" style="margin-top:12px"><button class="button primary sm" data-action="studentBulkApply" ${d.errors.length||!d.classes.length||!d.added&&!d.pending?'disabled':''}>استكمال واستيراد الشعب</button><button class="button white sm" data-action="studentBulkCancel">إلغاء المعاينة</button></div>`;

async function previewBulkRoster(file){
 if(!file)return;
 if(file.size>6*1024*1024)return toast('ملف Excel كبير؛ الحد الأعلى 6MB.',true);
 try{
  const sheets=/\.xlsx$/i.test(file.name)?workbookSheetRows(await unzipWorkbook(await file.arrayBuffer())):[{name:'',rows:readCSVRows(await file.text())}];

function applyBulkRoster(){

 if(Date.now()-d.created>30*60*1000){bulkRosterDraft=null;render();return toast('انتهت صلاحية المعاينة. أعد رفع الملف.',true)}

 for(const block of d.classes){
  let c=area.classes.find(x=>rosterNameKey(x.name.replace(/[-]/g,'/'))===rosterNameKey(block.name));
  if(!c){if(area.classes.length>=60){skipped+=block.students.length;continue}c={id:makeId('class'),name:block.name,students:[]};area.classes.push(c)}
  const old=new Map(c.students.map(s=>[rosterNameKey(s.name),s]));

   if(c.students.length>=300){skipped++;continue}
   const next={id:makeId('student'),name:st.name,level:st.level,group:null};c.students.push(next);old.set(key,next);added++;
  }
 }
 // تحقق بعد الدمج من وجود كل طالب في الكشف، وليس فقط عدد الأسماء.
 const missing=[];
 for(const block of d.classes){
  const c=area.classes.find(x=>rosterNameKey(x.name.replace(/[-]/g,'/'))===rosterNameKey(block.name));
  const ids=new Set((c?.students||[]).map(s=>rosterNameKey(s.name)));
  const absent=block.students.filter(st=>!ids.has(rosterNameKey(st.name)));
  if(absent.length)missing.push(`${block.name}: ${absent.length} طالبًا`);

}

 <div class="student-two-cols"><div class="card"><div class="card-head"><h3 class="card-title">الشعبة والطلبة</h3><span class="pill">${num(area.classes.length)} شعبة • ${num(area.classes.reduce((n,g)=>n+g.students.length,0))} طالبًا</span></div><div class="card-pad">${area.classes.length?`<div class="student-inline"><select id="studentClassSelect" aria-label="اختر شعبة"><option value="">اختر الشعبة</option>${area.classes.map(x=>`<option value="${esc(x.id)}" ${c?.id===x.id?'selected':''}>${esc(x.name)} (${x.students.length})</option>`).join('')}</select></div>`:`<div class="student-help">لا توجد شعب أو كشوف طلبة بعد. <button class="link-button" data-action="studentGoSettings">استورد الكشوف من الإعدادات</button></div>`}
 ${c?`<div class="student-stats"><span>يحتاج دعم: ${num(counters['يحتاج دعم']||0)}</span><span>متوسط: ${num(counters.متوسط||0)}</span><span>متقدم: ${num(counters.متقدم||0)}</span><span>غير مصنف: ${num(counters['غير مصنف']||0)}</span></div>
 <div class="student-roster">${c.students.length?c.students.map(s=>`<div class="student-roster-row"><span>${esc(s.name)} <small>${esc(s.level||'غير مصنف')} ${s.group!==null?'· '+esc(state.settings.groups[s.group]||String(s.group+1)):''}</small></span><select data-student-level-id="${esc(s.id)}" aria-label="تصنيف ${esc(s.name)}" style="max-width:128px;font-size:12px;padding:6px;border:1px solid #d8e5d6;border-radius:9px"><option value="" ${!s.level?'selected':''}>غير مصنف</option>${STUDENT_LEVELS.map(l=>`<option value="${l}" ${s.level===l?'selected':''}>${l}</option>`).join('')}</select></div>`).join(''):'<p class="caption">هذه الشعبة بلا طلبة. أضفهم من الإعدادات.</p>'}</div>`:area.classes.length?'<p class="student-help">اختر شعبة لتفعيل الاختيار العشوائي.</p>':''}</div></div>
 <div class="card"><div class="card-head"><h3 class="card-title">الاختيار العشوائي الذكي</h3><span class="pill">${area.mode==='teams'?'داخل المجموعة':'اختبار فردي'}</span></div><div class="card-pad">${area.mode==='individual'?`<div class="field"><label>اختر السؤال من بنك التقويم ${esc(state.settings.mode)}</label><select id="studentQuestionSelect"><option value="">اختر سؤالًا</option>${state.questions.map((it,i)=>`<option value="${esc(it.id)}" ${q?.id===it.id?'selected':''}>${i+1}. ${esc(it.text.slice(0,68))} (${esc(it.difficulty)})</option>`).join('')}</select></div><div class="student-inline"><select id="studentDifficulty" aria-label="صعوبة السؤال العشوائي">${['سهل','متوسط','صعب'].map(l=>`<option value="${l}" ${l===q?.difficulty?'selected':''}>${l}</option>`).join('')}</select><button class="button soft sm" data-action="studentRandomQ">سؤال عشوائي بالمستوى</button></div>`:`<div class="student-help">المجموعة الحالية: <b>${esc(state.settings.groups[group])}</b>. السؤال من «الميدان»: ${esc(q?.text||'لا توجد أسئلة بعد.')}</div>`}
 ${q?`<div class="student-question-summary"><span>السؤال: ${esc(q.text)}</span><small>الصعوبة: ${esc(q.difficulty)} • زمن ${num(q.time)} ثانية • يناسب ${esc(selectedLevel)}</small></div>`:'<p class="student-help">أضف سؤالًا لتبدأ الاختيار.</p>'}
 <label class="student-flex-row"><input type="checkbox" id="studentSoftMatch" ${area.softMatch?'checked':''}> <span>تنويع اختياري: قد يُختار طالب من المستوى المجاور أحيانًا</span></label>
 <div class="student-inline"><button class="button primary" data-action="studentDraw" ${!q||!c||!relevant.some(s=>STUDENT_LEVELS.includes(s.level))?'disabled':''}>اختيار طالب عشوائي</button><button class="button soft sm" data-action="studentRedraw" ${area.mode!=='individual'||!q||!c||!c.students.some(s=>STUDENT_LEVELS.includes(s.level))?'disabled':''}>اختيار طالب آخر</button>${area.mode==='individual'?`<button class="button white sm" data-action="studentOpenStage" ${!c||!q?'disabled':''}>عرض على السبورة</button>`:''}<select id="studentManualPick" aria-label="اختيار طالب يدوي"><option value="">اختيار يدوي</option>${relevant.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('')}</select><button class="button white sm" data-action="studentManual" ${!q||!c?'disabled':''}>اختيار</button></div>
 ${student?`<div class="student-picked"><span>الطالب المختار</span><strong>${esc(student.name)}</strong><small>${esc(c?.name||'')} ${area.mode==='teams'?'• '+esc(state.settings.groups[group]):''}</small></div>`:'<div class="student-help">لم يُسحب اسم بعد. لن يظهر مستوى الطالب في شاشة العرض.</div>'}
 ${area.mode==='individual'&&session&&q?`<div class="student-session"><div class="student-inline"><span class="student-timer" id="studentTimerDisplay">${fmtTime(session.timeLeft)}</span><button class="button primary sm" data-action="studentTimer" ${session.locked?'disabled':''}>${studentRunning?'إيقاف الوقت':session.started?'استئناف الوقت':'بدء الوقت'}</button><button class="button white sm" data-action="studentSkip" ${session.locked?'disabled':''}>انتهاء دون إجابة</button></div><p class="student-help">${session.locked?(session.assessment==='ختامي'&&!area.assessmentFinished.ختامي?'تم تسجيل إجابة الطالب دون كشف التصحيح.':`الإجابة ${session.answer===q.correct?'صحيحة':'غير صحيحة أو متروكة'}`):session.started?'اختر الإجابة قبل انتهاء المؤقت.':'ابدأ المؤقت لفتح الاختيارات.'}</p><div class="options-grid">${q.options.map((opt,i)=>`<button class="answer-card" data-action="studentAnswer" data-choice="${i}" ${!session.started||session.locked?'disabled':''}><span class="answer-letter">${LETTERS[i]}</span><span class="answer-text">${q.optionImages?.[i]?`<img src="${esc(q.optionImages[i])}" alt="صورة الخيار" style="max-width:120px;max-height:80px;display:block">`:''}${esc(opt)}</span></button>`).join('')}</div><div class="student-inline" style="margin-top:12px"><button class="button white sm" data-action="studentNext">محاولة جديدة</button></div></div>`:area.mode==='teams'?`<div class="student-help">سجّل إجابة المجموعة من «الميدان» بعد الاختيار. ${q&&state.started[q.id]&&!qIsLocked(q)?'السؤال مفتوح للإجابة.':'ابدأ وقت السؤال من الميدان أولًا.'} <button class="button white sm" data-action="tab" data-tab="live">الذهاب للميدان</button></div>`:''}
 </div></div></div>
 <div class="card" style="margin-top:18px"><div class="card-head"><h3 class="card-title">سجل التقويم الفردي • ${esc(state.settings.mode)}</h3><span class="pill">${num(done)} محاولة</span></div><div class="card-pad"><div class="student-inline"><span>الصحيحة: ${state.settings.mode==='ختامي'&&!area.assessmentFinished.ختامي?'مخفية حتى الإنهاء':num(correct)+' من '+num(done)}</span><button class="button white sm" data-action="openIndividualResults">عرض النتائج</button><button class="button white sm" data-action="studentExportReport">تصدير التقرير CSV</button>${state.settings.mode==='تكويني'||area.assessmentFinished.ختامي?`<button class="button soft sm" data-action="studentRecapPenalty">${ICONS.target} استعراض ركلات الإجابات</button>`:''}${state.settings.mode==='ختامي'?`<button class="button primary sm" data-action="studentFinishSummative">${ICONS.check} إنهاء التقويم الفردي وكشف النتائج</button>`:''}</div><div class="student-roster">${attempts.slice(-35).reverse().map(a=>{const s=c?.students.find(st=>st.id===a.studentId),question=findArchivedQuestion(a.questionId);return `<div class="student-roster-row"><span>${esc(s?.name||'طالب محذوف')} <small>${esc(question?.text.slice(0,55)||'سؤال سابق')}</small></span><strong>${state.settings.mode==='ختامي'&&!area.assessmentFinished.ختامي?'سُجلت الإجابة':a.correct?'صحيحة':'غير صحيحة'}</strong></div>`}).join('')||'<p class="caption">لم تُسجل محاولات في هذه الشعبة بعد.</p>'}</div></div></div>`;
}
function studentTeamPanel(){const area=state.studentArea,c=selectedClass(),q=qCurrent(),s=currentDraw();if(area.mode!=='teams'||!c||!q||state.finished)return '';
 const group=targetGroup();return `<section class="card card-pad student-team-panel"><div class="student-inline"><strong>اختيار طالب من ${esc(c.name)} للمجموعة ${esc(state.settings.groups[group])}</strong><button class="button primary sm" data-action="studentDraw" ${qIsLocked(q)?'disabled':''}>سحب اسم عشوائي</button><button class="button white sm" data-action="tab" data-tab="students">اختيار الطلبة</button></div><div class="student-team-name">${s?'المشارك: '+esc(s.name):'اضغط «سحب اسم عشوائي» قبل تسجيل الإجابة'}</div></section>`;
}
function studentProjectionMarkup(){
 const area=state.studentArea,s=currentDraw(),a=area.session,q=studentSessionQuestion()||studentQuestion()||qCurrent(),c=selectedClass(),finished=area.assessmentFinished[state.settings.mode];
 const showResult=!!a?.locked&&((a.assessment==='تكويني'&&a.answer===q?.correct&&a.revealed===true)||(a.assessment==='ختامي'&&finished));
 const canDraw=!!(c&&c.students.some(st=>STUDENT_LEVELS.includes(st.level))&&q);
 const awaitingDraw=!s;
 const questionArea=awaitingDraw?`<div class="student-stage-intro"><div class="student-stage-intro-tag">التقويم الفردي المتمايز</div><h2>من سيكون المشارك؟</h2><p>السؤال جاهز، والاسم لم يُكشف بعد.</p><button class="student-stage-draw" data-stage-action="studentDrawOnStage" ${!canDraw?'disabled':''}>اختيار طالب</button><div class="student-stage-intro-foot">${canDraw?'سيظهر اسم الطالب المختار عشوائيًا.':'بانتظار تجهيز الشعبة والسؤال.'}</div></div>`:
 q?`<h2>${esc(q.text)}</h2>${q.image?`<img class="stage-figure" src="${esc(q.image)}" alt="صورة السؤال">`:''}<div class="stage-opts">${q.options.map((opt,i)=>`<button class="stage-opt ${showResult&&i===q.correct?'yes':''}" data-student-choice="${i}" ${!a?.started||a.locked?'disabled':''}><b>${LETTERS[i]}</b><span class="stage-option-body">${q.optionImages?.[i]?`<img class="stage-option-image" src="${esc(q.optionImages[i])}" alt="صورة اختيار">`:''}${esc(opt)}</span></button>`).join('')}</div>${showResult?`<div class="stage-revealed">الإجابة الصحيحة: ${esc(LETTERS[q.correct])}${q.explanation?` • ${esc(q.explanation)}`:''}</div>`:a?.locked?`<div class="stage-pick-hint">${a.assessment==='تكويني'?'انتهت هذه المحاولة. اضغط «اختيار طالب آخر» ليجيب عن السؤال نفسه.':'سُجلت الإجابة. لا تُعرض صحتها قبل انتهاء التقويم.'}</div>`:''}`:'<h2>اختر سؤالًا من لوحة المعلم.</h2>';
 return `<div class="stage-wrap"><div class="stage-top"><div><div class="stage-title"><span class="stage-mark">${ICONS.brand}</span>ركلة ترجيحية • التقويم الفردي</div><div class="stage-sub">${esc(orgLine())} • ${esc(c?.name||'')}</div></div><span class="stage-kicker">اختيار عشوائي متمايز</span></div><div class="stage-content"><div class="stage-question ${stageDensity(q)}"><div class="stage-question-top"><span class="stage-kicker">${esc(s?.name||'بانتظار اختيار الطالب')}</span><div class="stage-clock-group"><span class="stage-time ${a&&a.timeLeft===0?'time-up':studentRunning&&a&&a.timeLeft<=10?'time-low':''}">${fmtTime(a?.timeLeft??q?.time??0)}</span></div></div>${questionArea}</div><aside class="stage-score"><h3 class="stage-score-title">المشارك</h3><div class="student-picked"><strong>${esc(s?.name||'بانتظار السحب')}</strong><small>${esc(c?.name||'')}</small></div><p class="stage-score-note">${s?'نقرأ السؤال ونفكر قبل اختيار الإجابة.':'سنختار الطالب أمام الجميع، دون إظهار تصنيفه.'}</p></aside></div><div class="stage-controlbar"><span class="stage-toolbar-status">تقويم ${esc(state.settings.mode)} • لا يظهر تصنيف الطالب</span>${awaitingDraw?`<button class="stage-btn stage-btn-next" data-stage-action="studentDrawOnStage" ${!canDraw?'disabled':''}>اختيار طالب</button>`:`<button class="stage-btn stage-btn-next" data-stage-action="studentRedraw" ${!canDraw?'disabled':''}>اختيار طالب آخر</button>`}<button class="stage-btn stage-btn-primary" data-stage-action="studentTimer" ${!a||a.locked?'disabled':''}>${studentRunning?'إيقاف الوقت':a?.started?'استئناف الوقت':'بدء الوقت'}</button><button class="stage-btn" data-stage-action="studentSkip" ${!a||a.locked?'disabled':''}>إنهاء دون إجابة</button><button class="stage-btn" data-stage-action="studentNext">محاولة جديدة</button><button class="stage-btn" data-stage-action="fullscreen">ملء الشاشة</button></div></div>`;
}
function studentCSVReport(classId){
 const area=state.studentArea,c=classId?(resultClasses(state.settings.mode).find(x=>x.id===classId)||area.classes.find(x=>x.id===classId)):selectedClass();if(!c)return toast('اختر شعبة.',true);
 if(state.settings.mode==='ختامي'&&!area.assessmentFinished.ختامي)return toast('نتائج التقويم الفردي الختامي مخفية حتى الإنهاء، فلا يمكن تصديرها الآن.',true);
 const rows=[['التقويم','الصف','اسم الطالب','السؤال','الصعوبة','الاختيار','الصحيح','النقاط','التاريخ']];
 for(const a of area.attempts.filter(a=>a.classId===c.id&&a.assessment===state.settings.mode)){
 const q=findArchivedQuestion(a.questionId);rows.push([a.assessment,c.name,c.students.find(s=>s.id===a.studentId)?.name||'محذوف',q?.text||'سؤال سابق',a.difficulty,a.answer<0?'دون إجابة':LETTERS[a.answer],a.correct?'نعم':'لا',a.points,a.time]);
 }
 const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download('تقرير_الطلبة_'+state.settings.mode+'.csv',csv,'text/csv;charset=utf-8');
}
function studentAction(btn){
 const area=state.studentArea,action=btn.dataset.action;
 switch(action){
 case 'studentMode':stopStudentTimer();area.mode=btn.dataset.mode==='teams'?'teams':'individual';area.selected=null;area.session=null;save();render();break;
 case 'studentDraw':drawStudent();break;
 case 'studentManual':studentManualSelect(el('studentManualPick')?.value);break;
 case 'studentGoSettings':state.activeTab='settings';save();render();document.getElementById('studentManagement')?.scrollIntoView({block:'start'});break;
 case 'studentDeleteClass':studentClassDelete();break;
 case 'schoolRosterRestore':restoreSchoolRoster();break;
 case 'studentBulkApply':applyBulkRoster();break;
 case 'studentBulkCancel':bulkRosterDraft=null;render();break;
 case 'studentRemove':studentDelete(btn.dataset.id);break;
 case 'studentTemplate':exportRosterTemplate();break;
 case 'studentExportRoster':rosterCSV();break;
 case 'studentRandomQ':studentRandomQuestion();break;
 case 'studentTimer':studentTimerToggle();break;
 case 'studentAnswer':studentChoose(Number(btn.dataset.choice));break;
 case 'studentSkip':studentFinishEarly();break;
 case 'studentNext':studentNewAttempt();break;
 case 'studentRedraw':studentRedraw();break;
 case 'studentOpenStage':
  // Start each fresh on-board selection with a hidden name; do not interrupt an active attempt.
  if(!area.session||!area.session.started||area.session.locked){stopStudentTimer();area.selected=null;area.session=null;save()}
  stageView='student';openStage();renderStage();break;
 case 'studentExportReport':studentCSVReport(btn.dataset.classId);break;
 case 'studentRecapPenalty':replayIndividualPenaltyResults();break;
 case 'studentFinishSummative':if(!confirm('إنهاء التقويم الفردي الختامي وإظهار النتائج؟'))break;area.assessmentFinished.ختامي=true;save();render();break;
 }
}

 window.addEventListener('beforeunload',()=>{stopStudentTimer();stopTimer();if(stageWin&&!stageWin.closed)stageWin.close()});
try{const seeded=applySchoolRosterSafely(false);if(seeded.cancelled)bootNotice=(bootNotice?bootNotice+' ':'')+'تعذّر تأمين نسخة احتياطية قبل تحديث كشوف الطلبة المدمجة، فأُلغي تحديث الكشوف فقط وتعمل بقية المنظومة. سيُعاد المحاولة عند التشغيل القادم.';else if(!seeded.info.skipped)save()}catch(e){console.warn('School roster seed error:',e.message)}
// شاشة البداية: جلسة نشطة ← «التشغيل»؛ درس بلا أسئلة ← «الأسئلة»؛ غير ذلك يبقى آخر تبويب.
function startTab(){
 const q=state.questions[state.currentIndex];
 const openQuestion=q&&state.started?.[q.id]&&!state.locked?.[q.id]&&!state.finished;
 const ses=state.studentArea?.session,individualOpen=ses&&ses.started&&!ses.locked;
 if(state.tieBreak?.active||openQuestion)return 'live';
 if(individualOpen)return 'students';
 if(!state.questions.length)return 'bank';
 return state.activeTab;
}
state.activeTab=startTab();
if(SCHOOL_NAME){
 const q=state.questions[state.currentIndex],ses=state.studentArea?.session;
 if(state.tieBreak?.active||(q&&state.started?.[q.id]&&!state.locked?.[q.id]&&!state.finished)||(ses&&ses.started&&!ses.locked))homeVisible=false;
}
render();
if(bootRecoveryRaw!==null)download('rakla_tarjihiya_recovery.json',bootRecoveryRaw,'application/json;charset=utf-8');
if(bootNotice)toast(bootNotice,true);
</script>
